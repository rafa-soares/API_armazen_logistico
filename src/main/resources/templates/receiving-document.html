<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px 50px;
            font-size: 14px;
            color: black;
        }
        h1 {
            text-align: center;
            text-transform: uppercase;
            font-weight: bold;
            font-size: 22px;
            margin-bottom: 30px;
        }
        .section-title {
            font-weight: bold;
            text-transform: uppercase;
            border-bottom: 1px solid black;
            padding-bottom: 5px;
            margin-top: 25px;
            margin-bottom: 15px;
            text-align: center;
            width: 100%;
        }
        .data-row {
            margin-bottom: 8px;
            display: flex;
            gap: 15px;
        }
        .label {
            width: 120px;
            font-weight: bold;
        }
        .value {
            min-width: 250px;
        }
        .product-block {
            margin-top: 20px;
        }
        p.declaration {
            margin-top: 40px;
            margin-left: 20px;
            margin-right: 20px;
            line-height: 1.3;
            text-align: justify;
        }
        .signature-line {
            margin-top: 60px;
            border-bottom: 1px solid black;
            width: 50%;
            margin-left: auto;
            margin-right: auto;
        }
        .signature-text {
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 16px;
        }
    </style>
</head>
<body>

<h1>COMPROVANTE DE RECEBIMENTO DE MERCADORIA</h1>

<div class="section-title">DADOS DO VENDEDOR</div>
<div class="data-row">
    <div class="label">Nome:</div>
    <div class="value" th:text="${sellerName}"></div>
</div>
<div class="data-row">
    <div class="label">CNPJ:</div>
    <div class="value" th:text="${sellerCnpj}"></div>
</div>

<div th:each="item : ${items}" class="product-block">
    <div class="section-title">DADOS DO PRODUTO</div>
    <div class="data-row">
        <div class="label">Descrição:</div>
        <div class="value" th:text="${item.description}"></div>
    </div>
    <div class="data-row">
        <div class="label">Quantidade:</div>
        <div class="value" th:text="${item.quantity}"></div>
    </div>
</div>

<p class="declaration">
    Eu, ________________________________________, declaro que entreguei o(s) produto(s) mencionado(s) neste comprovante.
</p>

<div class="signature-line"></div>
<div class="signature-text">ASSINATURA DO ENTREGADOR</div>

</body>
</html>
